services:
  # 1. Main Backend Web Service (Free Tier)
  - type: web
    name: chaos-tutor-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt -r ai_tutor_backend/requirements.txt"
    startCommand: "bash start_production.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHAOS_TUTOR_ALLOW_DEGRADED_SANDBOX
        value: "true"
      - key: CHAOS_TUTOR_CORS_ORIGINS
        value: "*"
      - key: FIREBASE_PROJECT_ID
        value: "chaoslad"
      - key: GEMINI_API_KEY
        sync: false # Enter your Gemini API key in Render Dashboard
      - key: AI_TUTOR_BASE_URL
        value: "http://127.0.0.1:5000"

  # 2. React Vite Frontend Static Site (Free Tier - Unlimited Bandwidth)
  - type: web
    name: chaos-tutor-frontend
    runtime: static
    buildCommand: "cd chaos && npm install && npm run build"
    staticPublishPath: ./chaos/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://chaos-tutor-backend.onrender.com"
      - key: VITE_FIREBASE_API_KEY
        value: "AIzaSyDn4FSw7IKNivJpP6cWxzFIlJX9J2iJHKc"
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: "chaoslad.firebaseapp.com"
      - key: VITE_FIREBASE_PROJECT_ID
        value: "chaoslad"
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: "chaoslad.firebasestorage.app"
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "139426691821"
      - key: VITE_FIREBASE_APP_ID
        value: "1:139426691821:web:0321f1e06faea782eaeae4"
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: "G-7CHP5RTH66"
