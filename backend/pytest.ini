[pytest]
# Without this, a bare `pytest` invoked from backend/ recursively discovers
# *every* test_*.py anywhere under this directory - including copies of
# these same test files that end up inside data/storage/<project-id>/ any
# time someone uploads this project (or any Python project that ships its
# own tests/) through the app. Two files that both import as top-level
# module `test_analyzer` (neither directory has __init__.py) collide, and
# collection fails for the *entire* suite with ModuleNotFoundError - not
# just for the offending file. Scoping discovery to tests/ makes this
# suite immune to whatever accumulates in data/ during normal use.
testpaths = tests
norecursedirs = data .git node_modules .venv venv __pycache__ .pytest_cache
